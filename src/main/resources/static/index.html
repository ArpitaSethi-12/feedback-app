<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Feedback Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f7; margin: 0; padding: 40px 0; }
    .card { max-width: 520px; margin: auto; background: #fff; padding: 28px 32px; border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #1f3b5b; margin: 0 0 4px; }
    p.sub { text-align: center; color: #5b6b7f; margin: 0 0 22px; font-size: 14px; }
    label { display: block; font-size: 14px; color: #333; margin: 12px 0 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 9px; border: 1px solid #cfd6e0; border-radius: 6px;
                              font-size: 14px; box-sizing: border-box; }
    .rating label { display: inline; font-weight: normal; margin-right: 12px; }
    .rating input { width: auto; }
    button { width: 100%; margin-top: 20px; padding: 11px; background: #2563eb; color: #fff; border: none;
             border-radius: 6px; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Online Feedback Form</h2>
    <p class="sub">We value your feedback</p>
    <form action="/submit" method="post">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="category">Feedback Category</label>
      <select id="category" name="category" required>
        <option value="">-- Select category --</option>
        <option>Course Content</option>
        <option>Faculty</option>
        <option>Lab Facilities</option>
        <option>Website</option>
        <option>Other</option>
      </select>

      <label>Rating</label>
      <div class="rating">
        <label><input type="radio" name="rating" value="1" required> 1</label>
        <label><input type="radio" name="rating" value="2"> 2</label>
        <label><input type="radio" name="rating" value="3"> 3</label>
        <label><input type="radio" name="rating" value="4"> 4</label>
        <label><input type="radio" name="rating" value="5"> 5</label>
      </div>

      <label for="comments">Comments</label>
      <textarea id="comments" name="comments" rows="4" placeholder="Write your comments"></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
